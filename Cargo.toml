# Virtual workspace. Each member is a package under crates/; see CRATES.md and
# docs/design/crate-split-plan.md. Isolated verification packages carry their
# own [workspace] table and are not members.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
# Nothing is published (plan decision D3).
publish = false

# Members depend on each other by path with an exact version and share the
# workspace version (plan decision D8).
[workspace.dependencies]
frost-collections-core = { path = "crates/frost-collections-core", version = "=0.4.0", default-features = false }
frost-collections-integer = { path = "crates/frost-collections-integer", version = "=0.4.0", default-features = false }
hashbrown = { version = "0.17", default-features = false }
indexmap = { version = "2.14", default-features = false }
serde = { version = "1.0.219", default-features = false }
rayon = { version = "1.11" }
arbitrary = { version = "1.4" }
borsh = { version = "1.5", default-features = false }
schemars = { version = "1.0", default-features = false }
smallvec = { version = "1.16", default-features = false, features = ["const_generics"] }
arrayvec = { version = "0.7.6", default-features = false }
imbl = { version = "7.0", default-features = false }
roaring = { version = "0.12.0", default-features = false }
fixedbitset = { version = "0.5", default-features = false }
slotmap = { version = "1.0", default-features = false }
phf = { version = "0.14", default-features = false, features = ["macros"] }
fst = { version = "0.4.7" }
dashmap = { version = "6.2" }
scc = { version = "3.8" }
crossbeam-skiplist = { version = "0.1" }
arc-swap = { version = "1.7" }

[workspace.lints.rust]
unsafe_code = "deny"            # allowed only in `adaptive::seq::buf`, with SAFETY comments
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
module_name_repetitions = "allow"
