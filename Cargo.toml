# Virtual workspace. Each member is a package under crates/; see CRATES.md and
# docs/design/crate-split-plan.md. Isolated verification packages carry their
# own [workspace] table and are not members.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
# Nothing is published (plan decision D3).
publish = false

[workspace.lints.rust]
unsafe_code = "deny"            # allowed only in `adaptive::seq::buf`, with SAFETY comments
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
must_use_candidate = "allow"
module_name_repetitions = "allow"
