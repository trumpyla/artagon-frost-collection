# Nextest configuration for frost-collections.
# Reference: https://nexte.st/docs/configuration/reference/
#
# Frost correctness tests are deterministic: no timing assertions, no sleeps,
# and persisted proptest seeds. Retries remain zero across all profiles so
# intermittent or schedule-dependent failures are never masked as flaky passes.

[profile.default]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "500ms"

[[profile.default.overrides]]
filter = 'binary(exhaustive_collections) | binary(publication_model) | binary(integer_sets) | binary(integer_output) | binary(api_contracts) | binary(metadata_and_factories) | binary(inline_safety) | binary(bitmap_set_ops)'
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 4 }
leak-timeout = "500ms"

[[profile.ci.overrides]]
filter = 'binary(exhaustive_collections) | binary(publication_model) | binary(integer_sets) | binary(integer_output) | binary(api_contracts) | binary(metadata_and_factories) | binary(inline_safety) | binary(bitmap_set_ops)'
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
report-name = "frost-collections-nextest"
store-success-output = false
store-failure-output = true

[profile.mutants]
# Fast-fail profile used when cargo-mutants runs with --test-tool=nextest.
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "500ms"
