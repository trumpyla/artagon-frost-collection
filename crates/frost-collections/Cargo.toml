required-features = ["std"]
harness = false

[[bench]]
name = "adaptive_maps"
required-features = ["std"]
harness = false

[[bench]]
name = "snapshots"
required-features = ["arc-swap-1"]
harness = false

[[bench]]
name = "integer_sets"
required-features = ["int-set"]
harness = false

[[example]]
name = "integer_sets"
required-features = ["int-set"]
test = true

[[bench]]
