[package]
name = "frost-int-downstream"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"
description = "Separate downstream compilation fixture for extensible Frost integer keys"

[workspace]

[dependencies]
frost = { package = "frost-collections", path = "../..", default-features = false, features = ["int-set"] }

[lints.rust]
unsafe_code = "forbid"
