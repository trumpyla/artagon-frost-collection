[package]
name = "frost-collections-concurrent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Live guarded access to concurrent collections and snapshot publication for Frost. Internal: depend on frost-collections"
license.workspace = true
publish.workspace = true
exclude = ["verification/**"]

[features]
default = ["std"]
# This package always needs `std`. `alloc` and `std` are empty so that every
# lane can name them in every package; no code here is gated on them.
alloc = []
std = []
int-set = ["frost-collections-core/int-set", "dep:frost-collections-integer"]
# Live access to each backend. The capability-trait implementations for these
# foreign types are in the core package behind the same feature names.
dashmap-6 = ["frost-collections-core/dashmap-6", "dep:dashmap"]
scc-3 = ["frost-collections-core/scc-3", "dep:scc"]
crossbeam-skiplist-0_1 = ["frost-collections-core/crossbeam-skiplist-0_1", "dep:crossbeam-skiplist"]
arc-swap-1 = ["dep:arc-swap"]
# Features of the core package, forwarded under the same names so that the
# surface this package re-exports can be configured through it.
hashbrown-0_17 = ["frost-collections-core/hashbrown-0_17"]
indexmap-2 = ["frost-collections-core/indexmap-2"]
serde-1 = ["frost-collections-core/serde-1"]
rayon-1 = ["frost-collections-core/rayon-1"]
arbitrary-1 = ["frost-collections-core/arbitrary-1"]
borsh-1 = ["frost-collections-core/borsh-1"]
schemars-1 = ["frost-collections-core/schemars-1"]
smallvec-1 = ["frost-collections-core/smallvec-1"]
arrayvec-0_7 = ["frost-collections-core/arrayvec-0_7"]
imbl-7 = ["frost-collections-core/imbl-7"]
roaring-0_12 = ["frost-collections-core/roaring-0_12"]
fixedbitset-0_5 = ["frost-collections-core/fixedbitset-0_5"]
slotmap-1 = ["frost-collections-core/slotmap-1"]
phf-0_14 = ["frost-collections-core/phf-0_14"]
fst-0_4 = ["frost-collections-core/fst-0_4"]

[dependencies]
frost-collections-core = { workspace = true, features = ["std"] }
frost-collections-integer = { workspace = true, features = ["std"], optional = true }
dashmap = { workspace = true, optional = true }
scc = { workspace = true, optional = true }
crossbeam-skiplist = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }

[dev-dependencies]
frost-collections-test-support = { workspace = true }

[[bench]]
name = "snapshots"
required-features = ["arc-swap-1"]
harness = false

[lints]
workspace = true
