[package]
name = "frost-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"
description = "Isolated libFuzzer harnesses and differential oracles for Frost"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
frost = { package = "frost-collections-integer", path = "..", features = ["arbitrary-1", "int-set", "borsh-1", "serde-1"] }
libfuzzer-sys = "0.4.13"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "frost_fuzz"
path = "src/lib.rs"
doc = false

[[bin]]
name = "ordered_set_algebra"
path = "fuzz_targets/ordered_set_algebra.rs"
test = false
doc = false
bench = false

[[bin]]
name = "integer_set_algebra"
path = "fuzz_targets/integer_set_algebra.rs"
test = false
doc = false
bench = false
