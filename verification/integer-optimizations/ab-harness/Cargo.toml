[package]
name = "frost-integer-optimizations-ab"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"
description = "Same-executable comparison of a baseline revision and the working tree"

[workspace]

[dependencies]
# The candidate is the working tree. `prepare-baseline.sh <rev>` archives the
# baseline revision into ./baseline under a renamed package, so one executable
# links both.
frost = { package = "frost-collections", path = "../../..", default-features = false, features = ["int-set", "std"] }
frost_baseline = { package = "frost-baseline", path = "baseline", default-features = false, features = ["int-set", "std"] }

[profile.release]
debug = false
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
