[package]
name = "frost-kani"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT OR Apache-2.0"
description = "Bounded proof harnesses for the actual Frost implementation"

[workspace]

[dependencies]
frost = { package = "frost-collections", path = "../..", default-features = false, features = ["alloc", "fixedbitset-0_5"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.metadata.kani.flags]
default-unwind = "1"
