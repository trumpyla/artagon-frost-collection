name: Rust verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows runners are disabled for now because of their cost
        # (maintainer decision of 2026-11-14). To restore them, use
        # [ubuntu-latest, macos-latest, windows-latest]; the Windows step below
        # is kept for that.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Install Make and jq on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make jq --no-progress --yes
      - name: Quality, contracts, and examples
        run: make check
      - name: Core, alloc, and default profiles
        run: make profiles
      - name: Execute example programs
        run: make examples

  shell-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shell validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bats jq shellcheck shfmt
      - run: make shell-check

  feature-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - name: Check each optional integration independently
        run: make features

  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target thumbv7em-none-eabihf,thumbv6m-none-eabi
      - run: make embedded

  integer-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Integer profile, optimized tests, and downstream codec extension
        run: make integers

  # Miri does not run on push or pull request (maintainer decision of
  # 2026-11-14). `make miri` runs in the nightly and release tiers of
  # verification.yml. This job keeps the error-code check that it started with.
  diagnostic-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup toolchain install nightly-2026-11-08 --profile minimal
      - name: Error codes of compile-fail doctests
        run: make doctest-codes

  publication-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Exhaustive finite domains and production retry schedules
        run: make bounded
      - name: Loom instrumented publication protocol
        run: make loom

  source-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Package and test extracted source
        run: make package

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit committed dependency versions against RustSec
        run: cargo audit --file Cargo.lock --deny warnings
